name: Update casks

# Daily: point each cask at its project's latest release once that release's
# provenance checks out, install it on macOS, then commit. GitHub pauses
# scheduled workflows after 60 days without repository activity; run this
# workflow by hand to resume.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.marque.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: marque
        id: marque
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-marque.sh
      - if: steps.marque.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: casks
          path: Casks/
          if-no-files-found: error
          retention-days: 3

  install:
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: casks
          path: Casks
      - run: scripts/test-cask.sh

  commit:
    needs: [check, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: casks
          path: Casks
      - name: Commit
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/marque.rb
          git commit -m "marque $VERSION"
          git push origin HEAD:main
